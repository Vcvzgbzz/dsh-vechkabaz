# Model route: dsh's built-in pi-ai adapter pointed at the OpenAI-compatible API.
- id: llm-pi-ai
  config:
    providers:
      vechkabaz:
        displayName: Vechkabaz
        api: openai-completions
        baseURL: https://ai.vechkabaz.com/api/v1
        apiKeyEnv: VECHKABAZ_API_KEY
        headers:
          User-Agent: dsh-vechkabaz/0.2.1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        # The server runs 3 requests per account at once; parallel subagents wait for a slot (~5 min).
        retryPolicy:
          mode: normal
          maxRetries: 25
          backoff:
            initialDelayMs: 1000
            maxDelayMs: 15000
        models:
          - id: coder-max
            name: coder-max
            contextWindow: 131072
            maxTokens: 32768

- id: agent-default-model
  config:
    provider: vechkabaz
    model: coder-max

# Base defaults to DeepSeek search, which needs a DEEPSEEK_API_KEY.
- id: web
  config:
    searchProvider: vechkabaz
    fetchProvider: vechkabaz

- insert:
    - id: vechkabaz-web
      name: dsh-vechkabaz

# The first-run popup asks for a DeepSeek key; the vechkabaz key goes on Settings → Models.
- id: ui-settings-models
  config:
    credentialOnboarding: false

- insert:
    - id: vechkabaz-memory
      name: dsh-vechkabaz/memory.js
